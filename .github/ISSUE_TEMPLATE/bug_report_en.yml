name: Bug report (EN)
description: Report a reproducible ClaraServ malfunction.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please provide the requested information. Never publish passwords, private keys, or tokens.
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Clearly explain the observed behaviour.
      placeholder: ClaraServ no longer answers the !gaufre command after…
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide a deterministic procedure and the relevant IRC message.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
      placeholder: |
        Expected: …
        Actual: …
    validations:
      required: true
  - type: input
    id: claraserv-version
    attributes:
      label: ClaraServ version
      placeholder: "e.g. 1.2.0 or commit abcdef0"
    validations:
      required: true
  - type: input
    id: tcl-version
    attributes:
      label: Tcl version
      placeholder: "Output of: tclsh <<< 'puts [info patchlevel]'"
    validations:
      required: true
  - type: input
    id: ircd
    attributes:
      label: IRCD and version
      placeholder: "e.g. UnrealIRCd 6.1.4"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Runtime mode
      description: Supported mode is standalone Tcl (tclsh ClaraServ.tcl).
      options:
        - Standalone Tcl (tclsh)
        - Other / I do not know
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs and configuration
      description: Redact every secret before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked that the issue was not already reported.
          required: true
        - label: I removed secrets from this report.
          required: true
