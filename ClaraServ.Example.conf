################## Lisez-moi
#
# Exemple de fichier de configuration pour les services ClaraServ.
# Après avoir apporté les modifications appropriées à ce fichier,
# placez-le sous le nom "ClaraServ.conf".
#
###

#########################################
#-->			UpLink				 <--#
#########################################
#
# Cette section est utilisée pour configurer ClaraServ
# pour se connecter à votre réseau IRC.
#
# Votre serveur IRCD doit avoir une configuration 
# correspondante pour autoriser le service ClaraServ à y accéder
#
# Schéma UnrealIRCd de laboratoire (PLACEHOLDERS uniquement — jamais de secrets
# dans le dépôt). Adapter la syntaxe `link` à la version exacte d’UnrealIRCd.
# Voir docs/UNREALIRCD.md avant tout test manuel.
#
#	listen IRCD_HOST_OR_LOOPBACK:IRCD_S2S_TLS_PORT {
#		options { serversonly; tls; };
#	};
#	ulines {
#		CLARASERV_SERVICE_NAME;
#	};
#	link CLARASERV_SERVICE_NAME {
#		# password-connect / password-receive = CLARASERV_LINK_PASSWORD
#		# (ne jamais coller le vrai secret dans un fichier versionné)
#		# hostname / bind-ip / class : selon votre version UnrealIRCd
#	};
#
#########################################

###
#
# L'adresse IP ou le nom d'hôte du serveur IRC auquel vous souhaitez connecter le service.
# Laboratoire local : typiquement IRCD_HOST_OR_LOOPBACK (souvent loopback).
### ->
set config(uplink_host)			"IRCD_HOST_OR_LOOPBACK"

###
# Activez avec la valeur 1 si le service doit se connecter à l'aide de SSL/TLS.
# Desactiver avec la valeur 0
# NOTE: IRCServices ouvre tls::socket avec -require 0 -request 0 (pas de validation
# CA côté client Tcl aujourd’hui). Politique labo : CA_FILE_OR_CERT_POLICY côté IRCd.
### ->
set config(uplink_ssl)			1

# Le port auquel se connecter (IRCD_S2S_TLS_PORT).
# L'IRCd *DOIT* écouter en serversonly+TLS sur ce port.
# Reportez-vous à votre documentation IRCd pour savoir comment procéder.
set config(uplink_port)			"IRCD_S2S_TLS_PORT"

###
# Mot de passe du lien S2S (CLARASERV_LINK_PASSWORD).
# Doit correspondre au bloc link UnrealIRCd. Ne jamais committer la vraie valeur.
#
# ATTENTION: si uplink_debug=1, IRCServices peut journaliser la ligne PASS.
# Garder uplink_debug à 0 hors diagnostic labo très court.
### ->
set config(uplink_password)		"CLARASERV_LINK_PASSWORD"


#########################################
#-->			ServerInfo			 <--#
#########################################

###
# Nom serveur/service S2S (CLARASERV_SERVICE_NAME). Doit être unique sur le réseau
# et identique à ulines/link côté UnrealIRCd.
### ->
set config(serverinfo_name)		"CLARASERV_SERVICE_NAME"

###
# Le texte qui devra apparaître comme informations du serveur dans le /whois et les requêtes similaires.
### ->
set config(serverinfo_descr)	"ClaraServ Service"

###
# SID TS6 du service (CLARASERV_SERVICE_SID). Requis pour UnrealIRCd moderne (TS6).
# Doit être unique sur le réseau. Format typique : 3 caractères [0-9A-Z].
### ->

# Si vous utilisez un "ancien serveur ircd" commentez ceci:
set config(serverinfo_id)		"CLARASERV_SERVICE_SID"
# et decommentez cela:
#set config(serverinfo_id)		""

###
# S'il est défini, cela permettra aux utilisateurs de laisser les services leur envoyer des PRIVMSG au lieu de NOTICE.
# Valeur: 1 pour oui, 0 pour non
### ->
set config(uplink_useprivmsg)	1

###
# Activez le mode debug socket?
### ->
set config(uplink_debug)		0

#########################################
#-->			Service			 <--#
#########################################

###
# Le nom du client ClaraServ.
### ->
set config(service_nick)		"ClaraServ"

###
# Le nom d'utilisateur du client ClaraServ.	
### ->
set config(service_user)		"services"

###
# Le nom d'hôte du client ClaraServ (souvent aligné sur CLARASERV_SERVICE_NAME).
### ->
set config(service_host)		"CLARASERV_SERVICE_NAME"

###
# Le realname du client ClaraServ.
### ->
set config(service_gecos)		"Visit: https://git.io/JYY9b"

###
# Modes du pseudoclient (spécifiques IRCd). Défaut Unreal 4+ : +Soiq
# Ne pas changer sans connaître le dialecte cible.
### ->
set config(service_modes)		"+Soiq"

###
# Salon d’activité / animations (et logs de commandes si log_command=1).
### ->
set config(service_channel)		"#Service"

###
# Modes forcés sur service_channel à l’EOS. Chaîne vide = aucun MODE (recommandé salon public).
# Ne PAS mettre +O sur un salon d’accueil (IRCops only → 520 pour Kiwi / users normaux).
# Au plus "+nt" sur un salon public ; "+Osnt" réservé aux salons logs/services.
### ->
set config(service_chanmodes)	""

###
# Mode user de ClaraServ sur le salon (ex. +o). Vide = aucun MODE user.
### ->
set config(service_usermodes)	"+o"

#########################################
#-->			Secrets				 <--#
#########################################
#
# Valeurs locales uniquement dans ClaraServ.conf (chmod 600, jamais versionné).
# Les placeholders / valeurs d’exemple ci-dessous sont rejetés par Check:Config.
#

###
# Mot de passe administrateur (commandes join/part privées).
# Obligatoire. Ne pas laisser la valeur d’exemple.
### ->
set config(admin_password)		"votre-mot-2-pass"

#########################################
#-->			Commandes / DB		 <--#
#########################################

###
# Activation des logs des commandes sur le salon config(service_channel) ?
# Booléen 0|1.
### ->
set config(log_command)		1

###
# Langue de la base d’animations : fr | en → db/database.<lang>.db
### ->
set config(db_lang)				"fr"

###
# Échec probabiliste des animations (0–100). 0 = désactivé (recommandé).
# Textes : db/fails.fr.db
### ->
# set config(failrate)			0

###
# Anti-flood animations : secondes entre deux animations pour un même nick sur un salon.
# 0 = désactivé.
### ->
# set config(rate_limit_cooldown)	2

#########################################
#-->			Runtime / instance	 <--#
#########################################

###
# Répertoire runtime standalone (PID, stop-file). Optionnel.
# Relatif à la racine du dépôt, ou chemin absolu.
# Défaut si absent : <racine>/run
# Ne pas versionner le contenu de ce répertoire.
### ->
#set config(runtime_dir)			"run"

###
# Nom d’instance optionnel (multi-instance). Lettres/chiffres/_-./ max 64.
# Si défini : PID et stop-file sous <runtime_dir>/<instance_name>/
# Défaut : fichiers directement sous runtime_dir (rétrocompatible).
### ->
#set config(instance_name)			"default"

#########################################
#-->			Debug				 <--#
#########################################
#
# uplink_debug est défini plus haut (section ServerInfo) — garder à 0 hors labo.
#

### -> Félicitation, vous êtes arrivez a la fin <- ###


